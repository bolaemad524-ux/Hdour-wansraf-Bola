                                <input placeholder="كلمة المرور" className="w-full border p-2 mb-4 rounded" value={editingUser.password} onChange={e=>setEditingUser({...editingUser, password:e.target.value})} />
                                <div className="flex gap-2"><button type="button" onClick={()=>setEditingUser(null)} className="flex-1 bg-slate-100 py-2 rounded">إلغاء</button><button className="flex-1 bg-indigo-600 text-white py-2 rounded">حفظ</button></div>
                            </form>
                        </div>
                    )}

                    {eventsFor && (
                        <div className="fixed inset-0 modal-overlay flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-sm rounded-xl shadow-2xl p-4 max-h-[80vh] overflow-y-auto">
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="font-bold text-lg">سجل أحداث: {eventsFor.name}</h3>
                                    <button onClick={()=>setEventsFor(null)} className="text-slate-500 text-xl leading-none">×</button>
                                </div>
                                {(!eventsFor.transactions || eventsFor.transactions.length === 0) ? (
                                    <p className="text-sm text-slate-400 text-center py-6">لا توجد أحداث</p>
                                ) : (
                                    <div className="space-y-2">
                                        {eventsFor.transactions.map((t, i) => (
                                            <div key={i} className="flex items-center justify-between gap-2 text-xs p-2 border rounded bg-slate-50">
                                                <div className="flex-1">
                                                    <div className="font-bold text-slate-800">{t.note}</div>
                                                    <div className="text-[10px] text-slate-400">{t.date}</div>
                                                </div>
                                                <span className={`font-bold ${Number(t.amount) >= 0 ? 'text-green-600' : 'text-red-600'}`}>
                                                    {Number(t.amount).toFixed(0)}
                                                </span>
                                                <button onClick={() => deleteTransaction(eventsFor, i)} className="bg-red-100 text-red-600 px-2 py-1 rounded text-[10px] font-bold">حذف</button>
                                            </div>
                                        ))}
                                    </div>
                                )}
                                <p className="text-[10px] text-slate-400 mt-3 text-center">الحذف يرجّع تأثير المبلغ على الرصيد تلقائيًا</p>
                            </div>
                        </div>
                    )}

                    {showReport && (() => {
                        const all = showReport.transactions || [];
                        const sum = (arr) => arr.reduce((s,t)=>s+Number(t.amount||0),0);
                        const attendCount = Number(showReport.attendanceDays) || all.filter(t => isDailyPay(t.note)).length || 0;
                        const absCount = calcAbsences(showReport).length;
                        const otItems = all.filter(t => /Overtime|over time|أوفر/i.test(t.note||''));
                        const otCount = (showReport.overtimeRequests||[]).filter(r=>r.status==='approved').length || otItems.length;
                        const addedItems = all.filter(t => /إضافة/.test(t.note||''));
                        const addedDays = addedItems.reduce((s,t)=>{ const m=String(t.note||'').match(/إضافة\s*([\d.]+)/); return s+(m?Number(m[1]):0); },0);
                        const bonusItems = all.filter(t => /حافز/.test(t.note||''));
                        const halfItems = all.filter(t => /نصف يوم/.test(t.note||''));
                        const deductItems = all.filter(t => t.type==='out' && !/نصف يوم/.test(t.note||''));
                        const Line = ({label, value, extra, color}) => (
                            <div className="flex justify-between items-center py-2 border-b border-slate-100 text-sm">
                                <span className="text-slate-700">{label}{extra ? <span className="text-slate-400 text-xs"> ({extra})</span> : null}</span>
                                <span className={`font-bold ${color||'text-slate-800'}`}>{value}</span>
                            </div>
                        );
                        return (
                        <div className="fixed inset-0 modal-overlay flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-sm rounded-lg shadow-2xl overflow-hidden max-h-[95vh] overflow-y-auto">
                            <div id="receipt-to-save" className="bg-white p-5">
                                <h2 className="text-center font-black text-xl">كشف حساب</h2>
                                <h3 className="text-center font-bold text-indigo-700 mb-1">{showReport.name}</h3>
                                <div className="text-[11px] text-slate-500 mb-4 text-center">{new Date().toLocaleString()}</div>
                                <Line label="إجمالي أيام الحضور" value={attendCount} extra="يوم" color="text-indigo-700" />
                                <Line label="أيام الغياب" value={absCount} extra="يوم" color="text-red-600" />
                                <Line label="Over Time" value={otCount} extra={`${sum(otItems).toFixed(0)} ج`} color="text-purple-700" />
                                <Line label="أيام أضافها المدير" value={addedDays} extra={`${sum(addedItems).toFixed(0)} ج`} color="text-blue-700" />
                                <Line label="الحوافز" value={`${sum(bonusItems).toFixed(0)} ج`} color="text-green-700" />
                                <div className="mt-2 mb-1 text-sm font-bold text-red-700">📉 الخصومات والمسحوبات</div>
                                {deductItems.length ? deductItems.map((t,i)=>(
                                    <div key={i} className="flex justify-between text-xs py-1 border-b border-red-50">
                                        <span className="text-slate-700">{t.note}{t.date ? <span className="text-slate-400"> — {t.date}</span> : null}</span>
                                        <span className="font-bold text-red-600">{Number(t.amount).toFixed(0)} ج</span>
                                    </div>
                                )) : <div className="text-xs text-slate-400 py-1">لا يوجد</div>}
                                <div className="flex justify-between text-sm py-1 font-bold"><span>إجمالي الخصومات</span><span className="text-red-600">{sum(deductItems).toFixed(0)} ج</span></div>
                                <Line label="خصم نصف يوم" value={`${sum(halfItems).toFixed(0)} ج`} extra={`${halfItems.length} مرة`} color="text-orange-600" />
                                <div className="flex justify-between items-center mt-4 pt-3 border-t-2 border-dashed">
                                    <span className="font-black text-lg">إجمالي الحساب</span>
                                    <span className="font-black text-xl text-green-700">{(Number(showReport.currentBalance)||0).toFixed(0)} ج</span>
                                </div>
                            </div>
                                <div className="flex flex-col gap-2 p-4 pt-0">
                                    <button onClick={()=>{
                                        const phone = toWhatsApp(showReport.whatsapp);
                                        if(!phone) return alert("لا يوجد رقم واتساب لهذا الموظف");
                                        const total = (Number(showReport.currentBalance)||0).toFixed(0);
                                        const deductLines = deductItems.length
                                            ? deductItems.map(t => `• ${t.note}: *${Number(t.amount).toFixed(0)} ج*`).join('\n')
                                            : '• لا يوجد';
                                        const msg =
`📄 *كشف حساب*
👤 ${showReport.name}
🗓️ ${new Date().toLocaleString()}
────────────────
🗓️ إجمالي أيام الحضور: *${attendCount}* يوم
🚫 أيام الغياب: *${absCount}* يوم
⏰ Over Time: *${otCount}*  |  ${sum(otItems).toFixed(0)} ج
➕ أيام أضافها المدير: *${addedDays}*  |  ${sum(addedItems).toFixed(0)} ج
🎁 الحوافز: *${sum(bonusItems).toFixed(0)} ج*
────────────────
📉 *الخصومات والمسحوبات:*
${deductLines}
🔻 الإجمالي: *${sum(deductItems).toFixed(0)} ج*
⏱️ خصم نصف يوم: *${sum(halfItems).toFixed(0)} ج* (${halfItems.length} مرة)
────────────────
💰 *إجمالي الحساب: ${total} ج*
✅ مع تحيات الإدارة`;
                                        const openText = () => window.open(`https://wa.me/${phone}?text=${encodeURIComponent(msg)}`, '_blank');
                                        if(window.html2canvas){
                                            html2canvas(document.getElementById('receipt-to-save'), {scale:2}).then(canvas=>{
                                                canvas.toBlob(async (blob)=>{
                                                    if(!blob){ openText(); return; }
                                                    const file = new File([blob], `كشف-${showReport.name}.png`, {type:'image/png'});
                                                    try {
                                                        if(navigator.share && navigator.canShare && navigator.canShare({files:[file]})){
                                                            await navigator.share({ files:[file], title:'كشف حساب', text: msg });
                                                            return;
                                                        }
                                                    } catch(e) {}
                                                    const link=document.createElement('a');
                                                    link.download=`كشف-${showReport.name}.png`;
                                                    link.href=canvas.toDataURL();
                                                    link.click();
                                                    openText();
                                                }, 'image/png');
                                            }).catch(() => openText());
                                        } else openText();
                                    }} className="w-full bg-green-600 text-white py-2 rounded font-bold text-sm">إرسال واتساب + صورة</button>
                                    <div className="flex gap-2">
                                    <button onClick={()=>{
                                        if(window.html2canvas){
                                            html2canvas(document.getElementById('receipt-to-save'), {scale:2}).then(canvas=>{
                                                const link=document.createElement('a');
                                                link.download=`كشف-${showReport.name}.png`;
                                                link.href=canvas.toDataURL();
                                                link.click();
                                            });
                                        } else alert("جاري التحميل...");
                                    }} className="flex-1 bg-indigo-600 text-white py-2 rounded font-bold text-sm">حفظ كصورة</button>
                                    <button onClick={()=>setShowReport(null)} className="flex-1 bg-slate-900 text-white py-2 rounded font-bold text-sm">إغلاق</button>
                                    </div>
                                </div>
                            </div>
                        </div>
                        );
                    })()}

                    {showPassModal && (
                        <div className="fixed inset-0 modal-overlay flex items-center justify-center p-4">
                            <div className="bg-white w-full max-w-xs p-6 rounded-2xl shadow-2xl text-center">
                                <h3 className="font-bold mb-4">تغيير باسورد المدير</h3>
                                <input placeholder="الجديد" className="w-full border p-2 mb-4 rounded text-center" value={newAdminPass} onChange={e=>setNewAdminPass(e.target.value)} />
                                <div className="flex gap-2"><button onClick={()=>setShowPassModal(false)} className="flex-1 bg-slate-100 py-2 rounded">إلغاء</button><button onClick={updateAdminPass} className="flex-1 bg-indigo-600 text-white py-2 rounded">حفظ</button></div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
