<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام الموظفين</title>
    
    <!-- React & Tailwind -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getFirestore, collection, doc, setDoc, updateDoc, onSnapshot, deleteDoc, query, orderBy } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

        // ✅ بيانات مشروعك
        const firebaseConfig = {
            apiKey: "AIzaSyCYGQp1Mx49WN-SxFuUC_A1uJ7k5TwleM0",
            authDomain: "ansraf-we-hdour.firebaseapp.com",
            projectId: "ansraf-we-hdour",
            storageBucket: "ansraf-we-hdour.firebasestorage.app",
            messagingSenderId: "720650434183",
            appId: "1:720650434183:web:e86e3d890f9342df076a22"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        
        window.db = db;
        window.dbMethods = { collection, doc, setDoc, updateDoc, onSnapshot, deleteDoc, query, orderBy };
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap');
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; user-select: none; -webkit-user-select: none; }
        /* إصلاح: السماح بالكتابة داخل الحقول (user-select:none كان بيمنع الكتابة في سفاري/آيفون) */
        input, textarea, select { user-select: text; -webkit-user-select: text; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #4f46e5; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes pulseAnim { 0%, 100% { transform: scale(0.5); opacity: 0.1; } 50% { transform: scale(0.62); opacity: 0.2; } }
        .pulse-animation { animation: pulseAnim 2s ease-in-out infinite; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.25s ease-out; }
        .emp-card { transition: all 0.2s; cursor: pointer; }
        .emp-card:active { transform: scale(0.95); }
        .modal-overlay { background-color: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 50; }
        .error-shake { animation: shakeError 0.5s ease-in-out; }
        @keyframes shakeError { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }
        .receipt { background: #fff; border: 1px dashed #ccc; padding: 20px; position: relative; }
        .receipt::before { content: ""; position: absolute; top: -5px; left: 0; width: 100%; height: 10px; background: radial-gradient(circle, transparent, transparent 50%, #fff 50%, #fff 100%) -7px -8px / 16px 16px repeat-x; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- إعدادات ---
        const MANAGER_PHONE = "201272128267"; // رقم واتساب المدير المرسل
        const INITIAL_ADMIN = { id: 'admin', name: 'المدير العام', password: '3316', role: 'admin' };
        const DEFAULT_WORK_HOURS = 8;
        const DEFAULT_START_HOUR = 11;

        // --- الأيام (getDay: الأحد = 0 ... السبت = 6) والترتيب المصري يبدأ بالسبت ---
        const DAY_NAMES = { 0: 'الأحد', 1: 'الاثنين', 2: 'الثلاثاء', 3: 'الأربعاء', 4: 'الخميس', 5: 'الجمعة', 6: 'السبت' };
        const WEEK_ORDER = [6, 0, 1, 2, 3, 4, 5];

        // --- الأيقونات ---
        const Icons = {
            Cloud: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.5 19c0-3.037-2.463-5.5-5.5-5.5S6.5 15.963 6.5 19"/><path d="M5 19c0-4 4-8 8-8s8 4 8 8"/><path d="M12 3v8"/></svg>,
            WifiOff: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="1" y1="1" x2="23" y2="23"></line><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"></path><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"></path><path d="M10.71 5.05A16 16 0 0 1 22.58 9"></path><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"></path><path d="M8.53 16.11a6 6 0 0 1 6.95 0"></path><line x1="12" y1="20" x2="12.01" y2="20"></line></svg>,
            User: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>,
            Lock: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>,
            Whatsapp: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path></svg>,
            Fingerprint: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>,
            LogOut: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>,
            Key: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 2l-2 2m-7.61 7.61a5.5 5.5 0 1 1-7.778 7.778 5.5 5.5 0 0 1 7.777-7.777zm0 0L15.5 7.5m0 0l3 3L22 7l-3-3m-3.5 3.5L19 4"/></svg>,
            Edit: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>,
            Report: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>,
            Clock: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>,
            Bell: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>,
            Wallet: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="2" y="5" width="20" height="14" rx="2" /><line x1="2" y1="10" x2="22" y2="10" /></svg>,
            Eye: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>,
            EyeOff: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>,
            Camera: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>,
            Calendar: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        };

        // تنسيق الوقت ثابت: 12 ساعة + ص/م
        const formatTime = (date = new Date()) => {
            let h = date.getHours();
            const m = String(date.getMinutes()).padStart(2, '0');
            const s = String(date.getSeconds()).padStart(2, '0');
            const ampm = h >= 12 ? 'م' : 'ص';
            h = h % 12 || 12;
            return `${h}:${m}:${s} ${ampm}`;
        };

        // تحويل "HH:MM" (24 ساعة) إلى 12 ساعة + ص/م
        const fmt12 = (hhmm) => {
            if (!hhmm) return '';
            const [h, m] = String(hhmm).split(':').map(Number);
            const ampm = h >= 12 ? 'م' : 'ص';
            const hh = h % 12 || 12;
            return `${hh}:${String(m || 0).padStart(2, '0')} ${ampm}`;
        };

        // ✅ إصلاح: التاريخ المحلي (toISOString كان بيرجع تاريخ UTC فيغلط بعد منتصف الليل بتوقيت مصر)
        const localDateStr = (d = new Date()) => {
            const p = (n) => String(n).padStart(2, '0');
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
        };

        // هل التاريخ المخزّن هو اليوم؟ (يدعم الصيغ القديمة)
        const isToday = (dateStr) => {
            if (!dateStr) return false;
            const today = localDateStr();
            if (dateStr === today) return true;
            try {
                const d = new Date(dateStr);
                if (!isNaN(d.getTime()) && localDateStr(d) === today) return true;
            } catch (e) {}
            return dateStr === new Date().toLocaleDateString();
        };

        // --- جدول المواعيد ---
        const getDaySchedule = (u, date = new Date()) => (u && u.schedule && u.schedule[String(date.getDay())]) || null;

        // موعد بداية الوردية (+5 دقائق سماح) أو إجازة. لو مفيش جدول لليوم يرجع للافتراضي (11 ص).
        const getShiftStart = (u, date = new Date()) => {
            const s = getDaySchedule(u, date);
            const d = new Date(date);
            if (s) {
                if (s.off) return { off: true, start: null };
                const [h, m] = String(s.from || '').split(':').map(Number);
                if (!isNaN(h)) { d.setHours(h, (m || 0) + 5, 0, 0); return { off: false, start: d }; }
            }
            d.setHours(u.workStartHour || DEFAULT_START_HOUR, 5, 0, 0);
            return { off: false, start: d };
        };

        const todayShiftText = (u) => {
            const s = getDaySchedule(u);
            if (!s) return null;
            return s.off ? 'إجازة اليوم 🌴' : `اليوم: ${fmt12(s.from)} - ${fmt12(s.to)}`;
        };

        const isDailyPay = (note) => String(note || '').startsWith('راتب يومي');
        const tomorrowStr = () => { const d = new Date(); d.setDate(d.getDate() + 1); return localDateStr(d); };
        const dateLabel = (str) => { const [y, m, d] = String(str).split('-').map(Number); return `${DAY_NAMES[new Date(y, m - 1, d).getDay()]} ${str}`; };
        const toMins = (hhmm) => { const [h, m] = String(hhmm || '').split(':').map(Number); return isNaN(h) ? null : h * 60 + (m || 0); };

        // هل شيفت الموظف ده يخص الوقت الحالي؟ (من ساعة قبل البداية لحد النهاية)
        const shiftCoversNow = (u, now = new Date()) => {
            const s = getDaySchedule(u, now);
            if (!s || s.off) return false;
            const f = toMins(s.from), t = toMins(s.to);
            if (f === null || t === null) return false;
            const mins = now.getHours() * 60 + now.getMinutes();
            return mins >= f - 60 && mins < t;
        };

        // 'ok' = في موعده | 'off' = يوم إجازته | 'outside' = خارج موعده (قبل البداية بأكتر من ساعة، أو بعد منتصف الشيفت، أو بعد النهاية)
        // لو مفيش جدول لليوم: 'ok' (مفيش سؤال)
        const classifyArrival = (u, now = new Date()) => {
            const s = getDaySchedule(u, now);
            if (!s) return 'ok';
            if (s.off) return 'off';
            const f = toMins(s.from), t = toMins(s.to);
            if (f === null || t === null) return 'ok';
            const mins = now.getHours() * 60 + now.getMinutes();
            if (mins < f - 60 || mins >= t || mins >= f + (t - f) / 2) return 'outside';
            return 'ok';
        };

        // أيام الغياب: يوم شغل في الجدول مفيهوش أي تسجيل (حضور / بديل / اتغطى / مُبرَّر)، من تاريخ بداية التتبع لحد دلوقتي
        const calcAbsences = (emp) => {
            if (!emp.schedule || !emp.absenceStart) return [];
            const seen = new Set((emp.attendanceLog || []).map(l => l.date));
            if (emp.lastCheckInDate) seen.add(emp.lastCheckInDate);
            const now = new Date();
            const todayStr = localDateStr(now);
            const [y, m, dd] = String(emp.absenceStart).split('-').map(Number);
            const d = new Date(y, m - 1, dd);
            const res = [];
            for (let i = 0; i < 400 && localDateStr(d) <= todayStr; i++) {
                const str = localDateStr(d);
                const s = emp.schedule[String(d.getDay())];
                if (s && !s.off && !seen.has(str)) {
                    if (str < todayStr) res.push(str);
                    else {
                        // النهارده: يتحسب غياب بس لو الشيفت خلص ولسه ما سجلش
                        const t = toMins(s.to);
                        if (t !== null && now.getHours() * 60 + now.getMinutes() >= t) res.push(str);
                    }
                }
                d.setDate(d.getDate() + 1);
            }
            return res;
        };

        const toWhatsApp = (num) => {
            if (!num) return '';
            let n = String(num).replace(/\D/g, '');
            if (n.startsWith('00')) n = n.slice(2);
            if (n.startsWith('0')) n = '20' + n.slice(1);
            if (!n.startsWith('20')) n = '20' + n;
            return n;
        };

        const getTotalDays = (u) => {
            const checkins = Number(u.attendanceDays) || (u.transactions||[]).filter(t => isDailyPay(t.note)).length || 0;
            const added = (u.transactions||[]).reduce((sum, t) => {
                const m = String(t.note||'').match(/إضافة\s*([\d.]+)/);
                return sum + (m ? Number(m[1]) : 0);
            }, 0);
            const ot = (u.overtimeRequests||[]).filter(r => r.status === 'approved').length;
            return checkins + added + ot;
        };

        const App = () => {
            const [users, setUsers] = useState([]);
            const [currentUser, setCurrentUser] = useState(null);
            const [loading, setLoading] = useState(true);
            const [dbError, setDbError] = useState(false);

            // ✅ إصلاح: اشتراك واحد في قاعدة البيانات (كان بيتعمل من جديد مع كل تسجيل دخول/خروج)
            // + انتظار تحميل Firebase بدل ما يظهر خطأ لو اتأخر
            useEffect(() => {
                let unsubscribe = null;
                let cancelled = false;
                let tries = 0;

                const start = () => {
                    if (cancelled) return;
                    if (!window.db) {
                        if (tries++ < 50) { setTimeout(start, 100); return; }
                        setDbError(true); setLoading(false); return;
                    }
                    const { collection, onSnapshot, query, setDoc, doc } = window.dbMethods;
                    unsubscribe = onSnapshot(query(collection(window.db, "users")), (snapshot) => {
                        const fetchedUsers = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
                        if (fetchedUsers.length === 0 || !fetchedUsers.find(u => u.id === 'admin')) {
                            setDoc(doc(window.db, "users", "admin"), INITIAL_ADMIN);
                        }
                        setUsers(fetchedUsers);
                        setCurrentUser(prev => {
                            if (!prev) return prev;
                            const me = fetchedUsers.find(u => u.id === prev.id);
                            return me || prev;
                        });
                        setLoading(false);
                    }, (error) => {
                        console.error("Connection Error:", error);
                        setDbError(true);
                        setLoading(false);
                    });
                };
                start();
                return () => { cancelled = true; if (unsubscribe) unsubscribe(); };
            }, []);

            const updateCloud = async (id, data) => {
                try { await window.dbMethods.updateDoc(window.dbMethods.doc(window.db, "users", id), data); } catch(e) { console.error(e); alert("تعذر الحفظ، تأكد من الإنترنت وحاول مرة أخرى"); }
            };
            const addToCloud = async (userData) => {
                try { await window.dbMethods.setDoc(window.dbMethods.doc(window.db, "users", userData.id), userData); } catch(e) { console.error(e); alert("تعذر الحفظ، تأكد من الإنترنت وحاول مرة أخرى"); }
            };
            const deleteFromCloud = async (id) => {
                if(confirm("حذف نهائي؟")) {
                    try { await window.dbMethods.deleteDoc(window.dbMethods.doc(window.db, "users", id)); } catch(e) { console.error(e); alert("تعذر الحذف"); }
                }
            };

            if (dbError) return <div className="h-screen flex flex-col items-center justify-center text-slate-500"><Icons.WifiOff /><p className="mt-2">تأكد من إعدادات قاعدة البيانات</p></div>;
            if (loading) return <div className="h-screen flex flex-col items-center justify-center"><div className="loader"></div><p className="mt-4 text-indigo-600 font-bold">جاري الاتصال بالسيرفر...</p></div>;

            if (!currentUser) return <KioskLogin users={users} onLogin={setCurrentUser} />;
            if (currentUser.role === 'admin') return <AdminDashboard users={users} onAdd={addToCloud} onUpdate={updateCloud} onDelete={deleteFromCloud} onLogout={()=>setCurrentUser(null)} />;
            return <EmployeeApp user={currentUser} users={users} onUpdate={updateCloud} onLogout={()=>setCurrentUser(null)} />;
        };

        const KioskLogin = ({ users, onLogin }) => {
            const [selected, setSelected] = useState(null);
            const [pass, setPass] = useState('');
            const [clicks, setClicks] = useState(0);
            const clickTimer = useRef(null);
            
            const employees = users.filter(u => u.role === 'employee');
            const admin = users.find(u => u.role === 'admin');

            // ✅ إصلاح: عدّاد الضغطات بيتصفّر بعد ثانيتين (كان بيتراكم على مدار اليوم)
            const handleAdmin = () => {
                const c = clicks + 1;
                clearTimeout(clickTimer.current);
                if (c >= 3) { setSelected(admin); setClicks(0); return; }
                setClicks(c);
                clickTimer.current = setTimeout(() => setClicks(0), 2000);
            };

            const login = (e) => {
                e.preventDefault();
                if (selected && pass === selected.password) {
                    setPass('');
                    onLogin(selected);
                } else {
                    alert("خطأ في كلمة المرور");
                }
            };

            return (
                <div className="min-h-screen bg-slate-100 p-6 flex flex-col items-center">
                    <div className="text-center mb-8 cursor-pointer select-none" onClick={handleAdmin}>
                        <div className="bg-indigo-600 w-16 h-16 rounded-2xl flex items-center justify-center mx-auto mb-4 text-white shadow-xl"><Icons.Cloud /></div>
                        <h1 className="text-3xl font-black text-slate-800">HR System</h1>
                        <p className="text-green-600 text-sm font-bold mt-1">● متصل أونلاين</p>
                    </div>
                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4 w-full max-w-4xl">
                        {employees.map(emp => (
                            <div key={emp.id} onClick={()=>setSelected(emp)} className="emp-card bg-white p-4 rounded-2xl shadow border border-slate-200 flex flex-col items-center relative overflow-hidden">
                                {emp.photo ? (
                                    <img src={emp.photo} alt={emp.name} className="w-16 h-16 rounded-full object-cover border-2 border-indigo-100 mb-2" />
                                ) : (
                                    <div className={`w-16 h-16 rounded-full flex items-center justify-center text-2xl font-bold text-white mb-2 ${emp.isCheckedIn ? 'bg-green-500':'bg-slate-400'}`}>{(emp.name||'?')[0]}</div>
                                )}
                                <span className="font-bold text-slate-700 text-sm text-center">{emp.name}</span>
                                {emp.isCheckedIn && <span className="absolute top-2 right-2 w-3 h-3 bg-green-500 rounded-full border-2 border-white shadow"></span>}
                                
                                {/* عرض الوقت أسفل الكارت */}
                                <div className="text-[10px] text-slate-500 mt-2 font-mono text-center w-full">
                                    {(isToday(emp.lastCheckInDate) || emp.isCheckedIn) && emp.lastCheckInTime && (
                                        <div className="text-green-600 bg-green-50 rounded px-1 mb-0.5">دخول: {emp.lastCheckInTime}</div>
                                    )}
                                    {isToday(emp.lastCheckOutDate) && emp.lastCheckOutTime && (
                                        <div className="text-red-500 bg-red-50 rounded px-1">خروج: {emp.lastCheckOutTime}</div>
                                    )}
                                </div>
                            </div>
                        ))}
                    </div>
                    {selected && (
                        <div className="fixed inset-0 bg-black/60 flex items-center justify-center p-4 z-50 backdrop-blur-sm">
                            <div className="bg-white w-full max-w-xs p-6 rounded-3xl shadow-2xl">
                                <h3 className="text-center font-bold text-xl mb-4">{selected.name}</h3>
                                <form onSubmit={login}>
                                    <input type="password" autoFocus value={pass} onChange={e=>setPass(e.target.value)} className="w-full text-center text-2xl p-3 border-2 rounded-xl mb-4" placeholder="••••" />
                                    <div className="flex gap-2">
                                        <button type="button" onClick={()=>{setSelected(null); setPass('');}} className="flex-1 bg-slate-100 py-3 rounded-xl font-bold">إلغاء</button>
                                        <button className="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold">دخول</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const EmployeeApp = ({ user, users = [], onUpdate, onLogout }) => {
            const [subMode, setSubMode] = useState(null); // null | 'off' | 'outside' | 'manual'
            const [showAllSub, setShowAllSub] = useState(false);
            const [tab, setTab] = useState('home');
            const [loading, setLoading] = useState(false);
            const [showDmg, setShowDmg] = useState(false);
            const [hasDmg, setHasDmg] = useState(null); 
            const [desc, setDesc] = useState('');
            const [showSalary, setShowSalary] = useState(false);
            const [errorMsg, setErrorMsg] = useState('');
            const [showWithdraw, setShowWithdraw] = useState(false);
            const [withdrawAmount, setWithdrawAmount] = useState('');
            const [withdrawNote, setWithdrawNote] = useState('');
            const [showAddDmg, setShowAddDmg] = useState(false);
            const [newDmgDesc, setNewDmgDesc] = useState('');

            const confirmWithdrawal = () => {
                if (!withdrawAmount || isNaN(withdrawAmount) || Number(withdrawAmount) <= 0) return;
                const amt = -Math.abs(Number(withdrawAmount));
                const note = withdrawNote || "مسحوب";
                onUpdate(user.id, {
                    currentBalance: (Number(user.currentBalance)||0) + amt,
                    transactions: [{date: new Date().toLocaleString(), type:'out', amount: amt, note: `مسحوب: ${note}`}, ...(user.transactions||[])]
                });
                setShowWithdraw(false); setWithdrawAmount(''); setWithdrawNote('');
            };

            const confirmAddDeduction = () => {
                if (!newDmgDesc) return;
                const dmgs = [{date: new Date().toLocaleString(), desc: newDmgDesc, status: null}, ...(user.damages||[])];
                onUpdate(user.id, { damages: dmgs });
                setShowAddDmg(false); setNewDmgDesc('');
            };

            const handleAction = async () => {
                try {
                    const now = new Date();

                    if (!user.isCheckedIn) {
                        if (isToday(user.lastCheckInDate)) {
                            setErrorMsg("لقد قمت بالحضور بالفعل اليوم");
                            setTimeout(() => setErrorMsg(''), 3000);
                            return;
                        }
                        // لو الحضور في غير موعده (أو يوم إجازته) نسأله هل هو بديل لموظف
                        const arrival = classifyArrival(user, now);
                        if (arrival !== 'ok') { setSubMode(arrival); return; }
                        processAttendance(true);
                    } else {
                        if (isToday(user.lastCheckOutDate)) {
                            alert("تم تسجيل الانصراف مسبقاً");
                            return;
                        }
                        // لو نسي انصراف يوم سابق
                        if (user.lastCheckInDate && !isToday(user.lastCheckInDate)) {
                            const time = prompt(`نسيت تسجل انصراف أمس (${user.lastCheckInDate})\nاكتب معاد الانصراف (مثال: 7:30 PM)`);
                            if (!time) return;
                            const updates = {
                                isCheckedIn: false,
                                lastCheckOutDate: user.lastCheckInDate,
                                lastCheckOutTime: time
                            };
                            await onUpdate(user.id, updates);
                            alert("تم تسجيل انصراف أمس بنجاح");
                            return;
                        }
                        setShowDmg(true);
                    }
                } catch(e) {
                    console.error(e);
                    alert("حدث خطأ بسيط، حاول مرة أخرى");
                }
            };

            const confirmOut = () => {
                let dmgs = [...(user.damages||[])];
                if (hasDmg && desc) {
                    dmgs.unshift({date: new Date().toLocaleString(), desc, status: null});
                }
                processAttendance(false, dmgs);
                setShowDmg(false); setHasDmg(null); setDesc('');
            };

            const processAttendance = async (isCheckIn, updatedDamages = null, rep = null) => {
                setLoading(true);
                try {
                    const now = new Date();
                    const today = localDateStr(now);
                    let updates = { isCheckedIn: isCheckIn };
                    if (updatedDamages) updates.damages = updatedDamages;

                    if(isCheckIn) {
                        const pay = user.dailyRate || 0;
                        const payNote = rep ? `راتب يومي (بديل عن ${rep.name})` : 'راتب يومي';
                        const logEntry = rep ? { date: today, type: 'sub', forId: rep.id, forName: rep.name } : { date: today, type: 'present' };
                        updates = { ...updates, lastCheckInDate: today, lastCheckInTime: formatTime(now), checkInTimestamp: now.getTime(), attendanceDays: (Number(user.attendanceDays)||0)+1, currentBalance: (Number(user.currentBalance)||0)+pay, attendanceLog: [...(user.attendanceLog||[]), logEntry].slice(-400), transactions: [{date: now.toLocaleString(), type:'in', amount:pay, note: payNote}, ...(user.transactions||[])] };
                        
                        // حساب التأخير (حسب جدول مواعيد اليوم، أو 11 ص لو مفيش جدول)
                        const shift = getShiftStart(user, now);
                        if (!rep && !shift.off && now > shift.start) {
                            updates.lateCount = (Number(user.lateCount)||0) + 1;
                        }
                        
                        const msgs = [
                            `أتمنى لك يوم سعيد يا ${user.name} 🌟`,
                            `يا بطل ${user.name}، يومك هيبقى تحفة 💪`,
                            `صباح النشاط يا ${user.name} ☀️`,
                            `يلا نبدأ يوم قوي يا ${user.name} 🔥`,
                            `ربنا يوفقك النهاردة يا ${user.name} 🙏`,
                            `خليك نشيط يا ${user.name}، هتنور المكان ✨`
                        ];
                        const randomMsg = msgs[Math.floor(Math.random() * msgs.length)];
                        if (rep) {
                            const coverNotif = { id: Date.now(), msg: `تم تغطية موعدك اليوم بواسطة ${user.name}`, date: new Date().toLocaleString() };
                            await onUpdate(rep.id, {
                                attendanceLog: [...(rep.attendanceLog||[]), { date: today, type: 'covered', byId: user.id, byName: user.name }].slice(-400),
                                notifications: [coverNotif, ...(rep.notifications||[])]
                            });
                        }
                        alert(`${randomMsg}\n\nلا تنسى ترشيد استهلاك الكهرباء اليوم ⚡`);
                    } else {
                        updates.lastCheckOutDate = today;
                        updates.lastCheckOutTime = formatTime(now);
                        if(user.checkInTimestamp) {
                            const h = (now.getTime() - user.checkInTimestamp)/36e5;
                            const target = user.targetHours || DEFAULT_WORK_HOURS;
                            if(h < target - 0.5) {
                                updates.earlyLeaveCount = (Number(user.earlyLeaveCount)||0)+1;
                                alert(`⚠️ انتبه: عملت ${h.toFixed(1)} ساعة فقط.`);
                            } else {
                                alert("تم تسجيل الانصراف بنجاح 👋");
                            }
                        } else {
                            alert("تم تسجيل الانصراف بنجاح 👋");
                        }
                    }
                    await onUpdate(user.id, updates);
                } catch(e) {
                    console.error("Error in processAttendance", e);
                    alert("حدث خطأ في الاتصال، تأكد من الإنترنت");
                }
                setLoading(false);
            };

            return (
                <div className="min-h-screen bg-white max-w-md mx-auto shadow-2xl relative pb-20">
                    <div className="bg-indigo-900 text-white p-6 rounded-b-[40px] pb-16 relative">
                        <div className="flex justify-between items-center">
                            <h1 className="font-bold text-lg flex items-center gap-2">
                                {user.photo && <img src={user.photo} className="w-8 h-8 rounded-full border border-white" />} 
                                {user.name}
                            </h1>
                            <button onClick={onLogout} className="bg-white/10 p-2 rounded-full"><Icons.LogOut /></button>
                        </div>
                        <p className="text-indigo-200 text-xs mt-1">متصل بالسحابة 🟢</p>
                    </div>

                    {errorMsg && (
                        <div className="fixed top-20 left-1/2 -translate-x-1/2 bg-red-500 text-white px-6 py-3 rounded-full shadow-xl font-bold z-50 error-shake">
                            ⛔ {errorMsg}
                        </div>
                    )}

                    <div className="mx-4 -mt-10 bg-white rounded-2xl shadow-lg p-4 flex justify-between text-center relative z-10">
                        <div><span className="text-xs text-slate-400">تأخير</span><p className="font-bold text-red-500">{user.lateCount||0}</p></div>
                        <div className="w-px bg-slate-100"></div>
                        <div><span className="text-xs text-slate-400">إجمالي الأيام</span><p className="font-bold text-indigo-600">{getTotalDays(user)}</p></div>
                        <div className="w-px bg-slate-100"></div>
                        <div><span className="text-xs text-slate-400">الرصيد</span><p className="font-bold text-green-600">{(user.currentBalance||0).toFixed(0)}</p></div>
                    </div>

                    <div className="p-6 text-center pt-8 pb-24">
                        {tab === 'home' && (
                            <div className="flex justify-center relative">
                                {!user.isCheckedIn && !loading && <div className="absolute inset-0 bg-indigo-500 rounded-full pulse-animation z-0"></div>}
                                <button onClick={handleAction} disabled={loading} className={`w-48 h-48 rounded-full border-4 shadow-2xl flex flex-col items-center justify-center mx-auto transition-all relative z-10 ${user.isCheckedIn ? 'bg-white border-red-500 text-red-500' : 'bg-indigo-600 border-indigo-200 text-white'}`}>
                                    {loading ? <div className="loader"></div> : (user.isCheckedIn ? <><Icons.LogOut /><span className="text-2xl font-bold mt-2">انصراف</span></> : <><Icons.Fingerprint /><span className="text-2xl font-bold mt-2">حضور</span></>)}
                                </button>
                            </div>
                        )}

                        {tab === 'home' && !user.isCheckedIn && !isToday(user.lastCheckInDate) && (
                            <div className="mt-8">
                                <button onClick={()=>setSubMode('manual')} className="text-sm font-bold text-indigo-600 bg-indigo-50 border border-indigo-200 px-4 py-2 rounded-full">🔄 أنا بديل لموظف آخر</button>
                            </div>
                        )}

                        {tab === 'wallet' && (
                            <div className="text-left space-y-4">
                                <div className="grid grid-cols-3 gap-2">
                                    <button onClick={()=>setShowWithdraw(true)} className="bg-orange-50 text-orange-700 py-3 rounded-xl font-bold text-xs border border-orange-200">مسحوبات</button>
                                    <button onClick={()=>setShowAddDmg(true)} className="bg-red-50 text-red-600 py-3 rounded-xl font-bold text-xs border border-red-200">إضافة خصم</button>
                                    <button onClick={()=>{
                                        if(!confirm("هل انت متأكد من انك اليوم Over time؟")) return;
                                        const today = localDateStr();
                                        // ✅ إصلاح: كان بيسمح بطلب ثاني في نفس اليوم لو الطلب الأول اتوافق عليه
                                        if((user.overtimeRequests||[]).some(r => r.date === today)) { alert("تم تسجيل طلب Over time لليوم بالفعل"); return; }
                                        const reqs = [{date: today, status: null}, ...(user.overtimeRequests||[])];
                                        onUpdate(user.id, {overtimeRequests: reqs});
                                        alert(`شكراً ${user.name} يا بطل 💪`);
                                    }} className="bg-purple-50 text-purple-700 py-3 rounded-xl font-bold text-xs border border-purple-200">Over time</button>
                                </div>
                                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex justify-between items-center">
                                    <div><p className="text-xs text-slate-400 mb-1">الراتب الأساسي</p><p className="font-bold text-lg text-slate-800 tracking-wider">{showSalary ? `${(user.salary||0).toFixed(0)} ج.م` : '******'}</p></div>
                                    <button onClick={() => setShowSalary(!showSalary)} className="p-2 text-indigo-500 hover:bg-indigo-50 rounded-full">{showSalary ? <Icons.EyeOff /> : <Icons.Eye />}</button>
                                </div>
                                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                                    <h3 className="font-bold mb-3 flex items-center gap-2 text-indigo-900"><Icons.Bell /> آخر الإشعارات</h3>
                                    <div className="space-y-2 max-h-40 overflow-y-auto">
                                        {(!user.notifications || user.notifications.length === 0) ? <p className="text-xs text-slate-400">لا توجد إشعارات</p> : 
                                         user.notifications.map((n, i) => (
                                            <div key={i} className="text-xs p-3 bg-slate-50 border-r-4 border-indigo-500 rounded-lg shadow-sm">
                                                <p className="font-bold text-slate-700">{n.msg}</p>
                                                <span className="text-[10px] text-slate-400 block mt-1">{n.date}</span>
                                            </div>
                                         ))}
                                    </div>
                                </div>
                                <div className="bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
                                    <h3 className="font-bold mb-3 flex items-center gap-2 text-green-700"><Icons.Wallet /> المعاملات</h3>
                                    <div className="space-y-2 max-h-60 overflow-y-auto">
                                        {(!user.transactions || user.transactions.length === 0) ? <p className="text-xs text-slate-400">لا معاملات</p> :
                                         user.transactions.map((t, i) => (
                                            <div key={i} className="flex justify-between items-center text-xs p-3 border-b last:border-0 hover:bg-slate-50 transition">
                                                <div>
                                                    <span className="font-bold block text-slate-800">{t.note}</span>
                                                    <span className="text-[10px] text-slate-400">{t.date}</span>
                                                </div>
                                                <span className={`font-bold text-sm ${t.type === 'in' ? 'text-green-600' : 'text-red-600'}`}>
                                                    {t.type === 'in' ? '+' : ''}{Number(t.amount).toFixed(0)}
                                                </span>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                    
                    <div className="fixed bottom-0 w-full bg-white border-t border-slate-200 p-2 flex justify-around items-center z-40 max-w-md shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.1)]">
                        <button onClick={()=>setTab('home')} className={`flex flex-col items-center gap-1 p-2 rounded-xl transition-all ${tab==='home'?'text-indigo-600 bg-indigo-50':'text-slate-400 hover:bg-slate-50'}`}><Icons.Fingerprint /> <span className="text-[10px] font-bold">الرئيسية</span></button>
                        <button onClick={()=>setTab('wallet')} className={`flex flex-col items-center gap-1 p-2 rounded-xl transition-all ${tab==='wallet'?'text-indigo-600 bg-indigo-50':'text-slate-400 hover:bg-slate-50'}`}><Icons.Wallet /> <span className="text-[10px] font-bold">حسابي</span></button>
                    </div>

                    {subMode && (() => {
                        const todayStr = localDateStr();
                        const nowD = new Date();
                        const others = (users || []).filter(u => u.role === 'employee' && u.id !== user.id && !(u.attendanceLog || []).some(l => l.date === todayStr && l.type === 'covered'));
                        const guesses = subMode === 'manual' ? [] : others.filter(u => shiftCoversNow(u, nowD));
                        const rest = others.filter(u => !guesses.includes(u));
                        const mine = getDaySchedule(user, nowD);
                        const reason = subMode === 'off'
                            ? 'اليوم إجازتك حسب جدول المواعيد.'
                            : subMode === 'outside'
                                ? `حضورك دلوقتي مش في موعدك${mine && !mine.off ? ` (موعدك اليوم ${fmt12(mine.from)} - ${fmt12(mine.to)})` : ''}.`
                                : '';
                        const showList = subMode === 'manual' || showAllSub || guesses.length === 0;
                        const closeSub = () => { setSubMode(null); setShowAllSub(false); };
                        const pick = (rep) => { closeSub(); processAttendance(true, null, rep); };
                        const tag = (u) => {
                            const s = getDaySchedule(u, nowD);
                            const st = s ? (s.off ? 'إجازة اليوم' : `${fmt12(s.from)} - ${fmt12(s.to)}`) : 'بدون جدول';
                            return isToday(u.lastCheckInDate) ? `${st} • حضر` : st;
                        };
                        return (
                            <div className="fixed inset-0 modal-overlay flex items-center justify-center z-50 p-4">
                                <div className="bg-white w-full max-w-xs p-5 rounded-2xl text-center max-h-[85vh] overflow-y-auto animate-fade-in">
                                    {reason && <p className="text-xs text-orange-600 font-bold mb-2">{reason}</p>}
                                    <h3 className="font-bold mb-4 text-lg">{guesses.length === 1 && !showList ? `هل أنت بديل للموظف ${guesses[0].name}؟` : 'أنت بديل لمين؟'}</h3>
                                    <div className="space-y-2">
                                        {guesses.map(u => (
                                            <button key={u.id} onClick={()=>pick(u)} className="w-full bg-green-600 text-white py-3 rounded-xl font-bold text-sm">
                                                نعم، بديل لـ {u.name}
                                                <span className="block text-[10px] font-normal opacity-80">{tag(u)}</span>
                                            </button>
                                        ))}
                                        {showList && rest.map(u => (
                                            <button key={u.id} onClick={()=>pick(u)} className="w-full bg-indigo-50 text-indigo-700 border border-indigo-200 py-2 rounded-xl font-bold text-sm">
                                                {u.name}
                                                <span className="block text-[10px] font-normal opacity-70">{tag(u)}</span>
                                            </button>
                                        ))}
                                        {showList && others.length === 0 && <p className="text-xs text-slate-400">مفيش موظفين تانيين</p>}
                                        {!showList && rest.length > 0 && (
                                            <button onClick={()=>setShowAllSub(true)} className="w-full bg-slate-100 py-2 rounded-xl text-sm font-bold">موظف آخر</button>
                                        )}
                                    </div>
                                    {subMode === 'manual' ? (
                                        <button onClick={closeSub} className="w-full mt-4 bg-slate-100 py-3 rounded-xl font-bold">إلغاء</button>
                                    ) : (
                                        <button onClick={()=>{ closeSub(); processAttendance(true); }} className="w-full mt-4 bg-slate-900 text-white py-3 rounded-xl font-bold">لا، مش بديل لحد</button>
                                    )}
                                </div>
                            </div>
                        );
                    })()}

                    {showDmg && (
                        <div className="fixed inset-0 modal-overlay flex items-center justify-center z-50 p-4">
                            <div className="bg-white w-full max-w-xs p-6 rounded-2xl text-center">
                                <h3 className="font-bold mb-4 text-lg">هل أتلفت شيئاً اليوم؟</h3>
                                {hasDmg === null ? (
                                    <div className="flex gap-3 justify-center"><button onClick={() => setHasDmg(true)} className="flex-1 bg-red-50 text-red-600 py-3 rounded-xl font-bold border border-red-200">نعم</button><button onClick={() => { setHasDmg(false); setTimeout(confirmOut, 100); }} className="flex-1 bg-indigo-600 text-white py-3 rounded-xl font-bold">لا</button></div>
                                ) : (
                                    <div className="animate-fade-in"><textarea className="w-full border p-3 rounded-xl text-sm h-24 mb-4" placeholder="ما هي التلفيات؟" value={desc} onChange={e=>setDesc(e.target.value)}></textarea><button onClick={confirmOut} disabled={!desc} className="w-full bg-slate-900 text-white py-3 rounded-xl font-bold disabled:opacity-50">تأكيد الانصراف</button></div>
                                )}
                            </div>
                        </div>
                    )}

                    {showWithdraw && (
                        <div className="fixed inset-0 modal-overlay flex items-center justify-center z-50 p-4">
                            <div className="bg-white w-full max-w-xs p-6 rounded-2xl text-center">
                                <h3 className="font-bold mb-4 text-lg">مسحوبات</h3>
                                <input type="number" placeholder="المبلغ" value={withdrawAmount} onChange={e=>setWithdrawAmount(e.target.value)} className="w-full border p-3 rounded-xl text-center text-lg mb-3" />
                                <input type="text" placeholder="السبب (اختياري)" value={withdrawNote} onChange={e=>setWithdrawNote(e.target.value)} className="w-full border p-3 rounded-xl text-center mb-4" />
                                <div className="flex gap-2">
                                    <button onClick={()=>{setShowWithdraw(false); setWithdrawAmount(''); setWithdrawNote('');}} className="flex-1 bg-slate-100 py-3 rounded-xl font-bold">إلغاء</button>
                                    <button onClick={confirmWithdrawal} className="flex-1 bg-orange-500 text-white py-3 rounded-xl font-bold">تأكيد</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showAddDmg && (
                        <div className="fixed inset-0 modal-overlay flex items-center justify-center z-50 p-4">
                            <div className="bg-white w-full max-w-xs p-6 rounded-2xl text-center">
                                <h3 className="font-bold mb-4 text-lg">إضافة خصم</h3>
                                <textarea placeholder="وصف الخصم أو التلفيات" value={newDmgDesc} onChange={e=>setNewDmgDesc(e.target.value)} className="w-full border p-3 rounded-xl text-sm h-24 mb-4"></textarea>
                                <div className="flex gap-2">
                                    <button onClick={()=>{setShowAddDmg(false); setNewDmgDesc('');}} className="flex-1 bg-slate-100 py-3 rounded-xl font-bold">إلغاء</button>
                                    <button onClick={confirmAddDeduction} disabled={!newDmgDesc} className="flex-1 bg-red-600 text-white py-3 rounded-xl font-bold disabled:opacity-50">إرسال</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const AdminDashboard = ({ users, onAdd, onUpdate, onDelete, onLogout }) => {
            const [newUser, setNewUser] = useState({ name: '', password: '', salary: '', hours: DEFAULT_WORK_HOURS, photo: '', whatsapp: '' });
            const [showAdd, setShowAdd] = useState(false);
            const [editingUser, setEditingUser] = useState(null);
            const [showPassModal, setShowPassModal] = useState(false);
            const [newAdminPass, setNewAdminPass] = useState('');
            const [showReport, setShowReport] = useState(null);
            const [eventsFor, setEventsFor] = useState(null);
            const [dmgCost, setDmgCost] = useState({});
            // جدول المواعيد
            const [scheduleFor, setScheduleFor] = useState(null);
            const [scheduleDraft, setScheduleDraft] = useState({});
            const [absForId, setAbsForId] = useState(null);
            
            const employees = users.filter(u => u.role === 'employee');
            const admin = users.find(u => u.role === 'admin');

            // دالة ضغط الصور وتحويلها لـ Base64
            const handleImageChange = (e, targetStateSetter, targetState) => {
                const file = e.target.files[0];
                if(file) {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const ctx = canvas.getContext('2d');
                            // تصغير الصورة لـ 150 بكسل فقط لتوفير المساحة
                            const MAX_SIZE = 150;
                            let width = img.width;
                            let height = img.height;
                            if (width > height) { if (width > MAX_SIZE) { height *= MAX_SIZE / width; width = MAX_SIZE; } } else { if (height > MAX_SIZE) { width *= MAX_SIZE / height; height = MAX_SIZE; } }
                            canvas.width = width;
                            canvas.height = height;
                            ctx.drawImage(img, 0, 0, width, height);
                            const dataUrl = canvas.toDataURL('image/jpeg', 0.7);
                            targetStateSetter({...targetState, photo: dataUrl});
                        }
                        img.src = event.target.result;
                    }
                    reader.readAsDataURL(file);
                }
            }

            const handleAdd = (e) => {
                e.preventDefault();
                const rate = parseFloat(newUser.salary)/30;
                onAdd({
                    id: Date.now().toString(), role: 'employee',
                    name: newUser.name, password: newUser.password, salary: parseFloat(newUser.salary), dailyRate: rate, targetHours: parseFloat(newUser.hours), photo: newUser.photo, whatsapp: newUser.whatsapp,
                    currentBalance: 0, isCheckedIn: false, lateCount: 0, earlyLeaveCount: 0, attendanceDays: 0, transactions: [], notifications: [], damages: [], overtimeRequests: []
                });
                setShowAdd(false); setNewUser({name:'', password:'', salary:'', hours: DEFAULT_WORK_HOURS, photo: '', whatsapp: ''});
            };

            const saveEdit = (e) => {
                e.preventDefault();
                const rate = parseFloat(editingUser.salary)/30;
                const notif = { id: Date.now(), msg: `تم تعديل بياناتك: الراتب (${editingUser.salary})`, date: new Date().toLocaleString() };
                onUpdate(editingUser.id, { 
                    name: editingUser.name, password: editingUser.password, salary: parseFloat(editingUser.salary), dailyRate: rate, targetHours: parseFloat(editingUser.targetHours), photo: editingUser.photo, whatsapp: editingUser.whatsapp,
                    notifications: [notif, ...(editingUser.notifications||[])]
                });
                setEditingUser(null);
            };

            // ---------- جدول مواعيد الموظف ----------
            const openSchedule = (emp) => {
                const defFrom = `${String(DEFAULT_START_HOUR).padStart(2, '0')}:00`;
                const endH = (DEFAULT_START_HOUR + (Number(emp.targetHours) || DEFAULT_WORK_HOURS)) % 24;
                const defTo = `${String(endH).padStart(2, '0')}:00`;
                const draft = {};
                for (let d = 0; d < 7; d++) {
                    const s = emp.schedule && emp.schedule[String(d)];
                    draft[d] = s ? { off: !!s.off, from: s.from || defFrom, to: s.to || defTo } : { off: false, from: defFrom, to: defTo };
                }
                setScheduleDraft(draft);
                setScheduleFor(emp);
            };

            const setDay = (d, patch) => setScheduleDraft(prev => ({ ...prev, [d]: { ...prev[d], ...patch } }));

            // إلغاء غياب يوم (مبرَّر): بيتسجل في السجل فمايتحسبش غياب
            const excuseAbsence = (emp, dateStr) => {
                if (!confirm(`إلغاء غياب ${dateLabel(dateStr)}؟`)) return;
                onUpdate(emp.id, { attendanceLog: [...(emp.attendanceLog || []), { date: dateStr, type: 'excused' }].slice(-400) });
            };

            // نسخ أوقات أول يوم عمل لباقي أيام العمل
            const copyFirstToAll = () => {
                const first = WEEK_ORDER.find(d => !scheduleDraft[d].off);
                if (first === undefined) return;
                const { from, to } = scheduleDraft[first];
                setScheduleDraft(prev => {
                    const n = { ...prev };
                    WEEK_ORDER.forEach(d => { if (!n[d].off) n[d] = { ...n[d], from, to }; });
                    return n;
                });
            };

            const saveSchedule = () => {
                for (const d of WEEK_ORDER) {
                    const s = scheduleDraft[d];
                    if (!s.off) {
                        if (!s.from || !s.to) return alert(`حدد وقت البداية والنهاية ليوم ${DAY_NAMES[d]}`);
                        if (s.to <= s.from) return alert(`وقت النهاية لازم يكون بعد وقت البداية ليوم ${DAY_NAMES[d]}`);
                    }
                }
                const schedule = {};
                WEEK_ORDER.forEach(d => {
                    const s = scheduleDraft[d];
                    schedule[String(d)] = s.off ? { off: true } : { off: false, from: s.from, to: s.to };
                });
                const notif = { id: Date.now(), msg: 'تم تحديث جدول مواعيد عملك', date: new Date().toLocaleString() };
                onUpdate(scheduleFor.id, { schedule, ...(scheduleFor.absenceStart ? {} : { absenceStart: tomorrowStr() }), notifications: [notif, ...(scheduleFor.notifications || [])] });
                setScheduleFor(null);
            };

            const addTransaction = (emp, amount, note) => {
                const newTrans = { date: new Date().toLocaleString(), amount, note, type: amount > 0 ? 'in' : 'out' };
                onUpdate(emp.id, { currentBalance: (Number(emp.currentBalance)||0) + amount, transactions: [newTrans, ...(emp.transactions || [])] });
            };

            const deleteTransaction = (emp, idx) => {
                const list = [...(emp.transactions || [])];
                const t = list[idx];
                if (!t) return;
                if (!confirm(`حذف هذا الحدث؟\n${t.note}\n${t.amount}`)) return;
                list.splice(idx, 1);
                const updates = {
                    transactions: list,
                    currentBalance: (Number(emp.currentBalance) || 0) - Number(t.amount || 0)
                };
                // لو كان حضور يومي نقص العداد
                if (isDailyPay(t.note)) {
                    updates.attendanceDays = Math.max(0, (Number(emp.attendanceDays) || 0) - 1);
                }
                // لو كان أوفر تايم ألغِ الموافقة المطابقة
                if (/Overtime|over time|أوفر/i.test(t.note || '')) {
                    const reqs = [...(emp.overtimeRequests || [])];
                    const ri = reqs.findIndex(r => r.status === 'approved' && (t.note || '').includes(r.date));
                    if (ri >= 0) reqs[ri] = { ...reqs[ri], status: null };
                    updates.overtimeRequests = reqs;
                }
                onUpdate(emp.id, updates);
                // حدّث النافذة لو مفتوحة
                setEventsFor(prev => prev && prev.id === emp.id ? { ...prev, ...updates, transactions: list } : prev);
            };

            // ✅ إصلاح: سعر التلفيات كان مشترك بين كل الموظفين (مفتاحه رقم التلف فقط) فبيتخصم سعر موظف تاني
            const resolveDamage = (emp, idx) => {
                const key = `${emp.id}-${idx}`;
                const cost = parseFloat(dmgCost[key]); if(!cost) return;
                const newDamages = [...emp.damages]; newDamages[idx] = { ...newDamages[idx], status: 'resolved', cost };
                addTransaction(emp, -cost, `تلفيات: ${newDamages[idx].desc}`);
                onUpdate(emp.id, { damages: newDamages });
                setDmgCost(prev => { const n = { ...prev }; delete n[key]; return n; });
            };

            const updateAdminPass = () => {
                if(newAdminPass.length < 3) return alert("ضعيف");
                onUpdate(admin.id, { password: newAdminPass });
                setShowPassModal(false); alert("تم التغيير");
            };

            // دالة لحساب التأخير (حسب جدول مواعيد يوم الحضور)
            const checkLateStatus = (emp) => {
                if (!emp.checkInTimestamp || !isToday(emp.lastCheckInDate)) return null;
                if ((emp.attendanceLog || []).some(l => l.date === localDateStr() && l.type === 'sub')) return null;
                const checkInDate = new Date(emp.checkInTimestamp);
                const shift = getShiftStart(emp, checkInDate);
                return !shift.off && checkInDate > shift.start;
            };

            return (
                <div className="min-h-screen bg-slate-50 p-4 pb-20">
                    <div className="flex justify-between items-center mb-6">
                        <h2 className="font-bold text-xl flex gap-2"><Icons.Cloud /> الإدارة</h2>
                        <div className="flex gap-2">
                            <button onClick={()=>setShowPassModal(true)} className="bg-indigo-100 p-2 rounded-full text-indigo-600"><Icons.Key /></button>
                            <button onClick={onLogout} className="bg-red-100 text-red-600 px-3 py-1 rounded-lg text-sm font-bold">خروج</button>
                        </div>
                    </div>

                    <button onClick={()=>setShowAdd(!showAdd)} className="w-full bg-indigo-600 text-white py-3 rounded-xl font-bold mb-4 shadow">+ موظف جديد</button>
                    
                    {showAdd && (
                        <form onSubmit={handleAdd} className="bg-white p-4 rounded-xl shadow mb-4">
                            <div className="grid gap-2">
                                <div className="flex items-center gap-2 border p-2 rounded justify-between bg-slate-50 cursor-pointer relative">
                                    <span className="text-sm text-slate-500">{newUser.photo ? 'تم اختيار صورة' : 'صورة الموظف'}</span>
                                    <Icons.Camera />
                                    <input type="file" accept="image/*" className="absolute inset-0 opacity-0 cursor-pointer" onChange={(e) => handleImageChange(e, setNewUser, newUser)} />
                                </div>
                                {newUser.photo && <img src={newUser.photo} className="w-20 h-20 rounded-full mx-auto object-cover border-2" />}
                                <input placeholder="الاسم" value={newUser.name} onChange={e=>setNewUser({...newUser, name:e.target.value})} className="border p-2 rounded" required />
                                <input placeholder="كلمة المرور" value={newUser.password} onChange={e=>setNewUser({...newUser, password:e.target.value})} className="border p-2 rounded" required />
                                <input placeholder="رقم الواتساب" value={newUser.whatsapp} onChange={e=>setNewUser({...newUser, whatsapp:e.target.value})} className="border p-2 rounded" />
                                <input type="number" placeholder="الراتب" value={newUser.salary} onChange={e=>setNewUser({...newUser, salary:e.target.value})} className="border p-2 rounded" required />
                                <input type="number" placeholder="ساعات العمل" value={newUser.hours} onChange={e=>setNewUser({...newUser, hours:e.target.value})} className="border p-2 rounded" required />
                                <button className="bg-slate-800 text-white py-2 rounded">حفظ</button>
                            </div>
                        </form>
                    )}

                    <div className="space-y-4">
                        {employees.map(emp => {
                            const isLate = checkLateStatus(emp);
                            const shiftText = todayShiftText(emp);
                            const absList = calcAbsences(emp);
                            const todayLog = (emp.attendanceLog || []).filter(l => l.date === localDateStr());
                            const subEntry = todayLog.find(l => l.type === 'sub');
                            const covEntry = todayLog.find(l => l.type === 'covered');
                            return (
                            <div key={emp.id} className="bg-white p-4 rounded-xl shadow border border-slate-200">
                                <div className="flex justify-between items-center mb-2">
                                    <div className="flex items-center gap-3">
                                        {emp.photo ? <img src={emp.photo} className="w-10 h-10 rounded-full object-cover" /> : <div className={`w-10 h-10 rounded-full flex items-center justify-center font-bold text-white ${emp.isCheckedIn ? 'bg-green-500' : 'bg-slate-300'}`}>{(emp.name||'?')[0]}</div>}
                                        <div>
                                            <h3 className="font-bold text-lg flex items-center gap-2">
                                                {emp.name}
                                                {isLate && <span className="bg-red-500 text-white text-[9px] px-1.5 rounded-full animate-pulse">متأخر</span>}
                                            </h3>
                                            <div className="text-[10px] text-slate-500 mt-0.5">
                                                {(isToday(emp.lastCheckInDate) || emp.isCheckedIn) && emp.lastCheckInTime && <span className="text-green-600 ml-2">دخول: {emp.lastCheckInTime}</span>}
                                                {isToday(emp.lastCheckOutDate) && emp.lastCheckOutTime && <span className="text-red-500">خروج: {emp.lastCheckOutTime}</span>}
                                            </div>
                                            {shiftText && <div className="text-[10px] text-teal-700 mt-0.5 font-bold">{shiftText}</div>}
                                            {subEntry && <div className="text-[10px] text-purple-700 mt-0.5 font-bold">🔄 بديل عن {subEntry.forName}</div>}
                                            {covEntry && <div className="text-[10px] text-orange-600 mt-0.5 font-bold">🔄 اتغطى موعده بواسطة {covEntry.byName}</div>}
                                        </div>
                                    </div>
                                    <div className="flex gap-2 items-center">
                                        <button onClick={()=>openSchedule(emp)} className="text-teal-600" title="جدول المواعيد"><Icons.Calendar /></button>
                                        <button onClick={()=>setEditingUser(emp)} className="text-blue-500"><Icons.Edit /></button>
                                        <button onClick={()=>setShowReport(emp)} className="text-indigo-500"><Icons.Report /></button>
                                        <button onClick={()=>setEventsFor(emp)} className="text-slate-600 text-xs font-bold px-2 py-1 bg-slate-100 rounded">سجل</button>
                                    </div>
                                </div>
                                <div className="flex justify-between items-center bg-slate-50 p-2 rounded text-xs mb-2">
                                    <span>الرصيد: <b className="text-green-600">{(Number(emp.currentBalance)||0).toFixed(0)}</b></span>
                                    <span>إجمالي الأيام: <b className="text-indigo-600">{getTotalDays(emp)}</b></span>
                                    <span>المطلوب: {emp.targetHours} س</span>
                                </div>
                                
                                {emp.schedule && (
                                    <button onClick={()=>setAbsForId(emp.id)} className={`w-full text-xs py-1.5 rounded font-bold mb-2 border ${absList.length > 0 ? 'bg-red-50 text-red-700 border-red-100' : 'bg-slate-50 text-slate-500 border-slate-100'}`}>
                                        {absList.length > 0 ? `🚫 غاب ${absList.length} يوم حتى الآن — اضغط للتفاصيل` : 'لا غياب مسجل ✅'}
                                    </button>
                                )}
                                {emp.damages?.map((d, i) => !d.status && (
                                    <div key={i} className="bg-red-50 p-2 mb-2 rounded flex justify-between items-center border border-red-100"><span className="text-xs text-red-600 font-bold">⚠️ {d.desc}</span><div className="flex gap-1"><input type="number" placeholder="سعر" className="w-16 p-1 text-xs border rounded" value={dmgCost[`${emp.id}-${i}`] || ''} onChange={e => setDmgCost({...dmgCost, [`${emp.id}-${i}`]: e.target.value})} /><button onClick={() => resolveDamage(emp, i)} className="bg-red-600 text-white px-2 py-1 text-xs rounded">خصم</button></div></div>
                                ))}
                                {emp.overtimeRequests?.map((r, i) => !r.status && (
                                    <div key={i} className="bg-purple-50 p-2 mb-2 rounded flex justify-between items-center border border-purple-100">
                                        <span className="text-xs text-purple-700 font-bold">Overtime: {r.date}</span>
                                        <button onClick={()=>{
                                            const reqs = [...(emp.overtimeRequests||[])];
                                            reqs[i] = { ...reqs[i], status: 'approved' };
                                            const extra = emp.dailyRate || 0;
                                            addTransaction(emp, extra, `Overtime: ${r.date}`);
                                            onUpdate(emp.id, {overtimeRequests: reqs});
                                        }} className="bg-purple-600 text-white px-2 py-1 text-xs rounded">موافقة</button>
                                    </div>
                                ))}

                                <div className="grid grid-cols-2 gap-2 mt-2">
                                    <button onClick={()=>{ if(confirm("تأكيد خصم نصف يوم؟")) addTransaction(emp, -(emp.dailyRate/2 || 0), "خصم نصف يوم"); }} className="text-xs bg-red-50 text-red-600 py-2 rounded font-bold">خصم نصف يوم</button>
                                    <button onClick={()=>{const v=prompt("أيام:"); if(v && !isNaN(parseFloat(v))) addTransaction(emp, parseFloat(v)*emp.dailyRate, `إضافة ${v} أيام`)}} className="text-xs bg-blue-50 text-blue-600 py-2 rounded font-bold">+ أيام عمل</button>
                                    <button onClick={()=>{const v=prompt("حافز:"); if(v && !isNaN(parseFloat(v))) addTransaction(emp, parseFloat(v), "حافز")}} className="text-xs bg-green-50 text-green-600 py-2 rounded font-bold">حافز</button>
                                    <button onClick={()=>{const d=prompt("وصف الخصم:"); if(d){const cost=prompt("السعر:"); if(cost && !isNaN(parseFloat(cost))){const dmgs=[{date:new Date().toLocaleString(),desc:d,status:'resolved',cost:parseFloat(cost)},...(emp.damages||[])]; addTransaction(emp, -parseFloat(cost), `خصم: ${d}`); onUpdate(emp.id,{damages:dmgs});}}}} className="text-xs bg-red-100 text-red-700 py-2 rounded font-bold">+ خصم جديد</button>
                                    <div className="col-span-2 flex gap-1"><button onClick={()=>{ if(confirm("تصفير؟")) onUpdate(emp.id, {currentBalance:0, lateCount:0, earlyLeaveCount:0, attendanceDays:0, damages:[], transactions:[], overtimeRequests:[], attendanceLog:[], absenceStart: tomorrowStr()}); }} className="flex-1 text-xs bg-slate-800 text-white py-2 rounded font-bold">تصفير (قبض)</button><button onClick={()=>onDelete(emp.id)} className="px-3 text-xs bg-red-100 text-red-600 rounded font-bold">حذف</button></div>
                                </div>
                            </div>
                        )})}
                    </div>

                    {scheduleFor && (
                        <div className="fixed inset-0 modal-overlay flex items-center justify-center p-4 z-50">
                            <div className="bg-white w-full max-w-md rounded-xl shadow-2xl p-4 max-h-[90vh] overflow-y-auto animate-fade-in">
                                <div className="flex justify-between items-center mb-3">
                                    <h3 className="font-bold text-lg flex items-center gap-2 text-teal-700"><Icons.Calendar /> جدول مواعيد: {scheduleFor.name}</h3>
                                    <button onClick={()=>setScheduleFor(null)} className="text-slate-500 text-2xl leading-none">×</button>
                                </div>
                                <table className="w-full text-sm">
                                    <thead>
                                        <tr className="text-xs text-slate-500 border-b">
                                            <th className="py-2 text-right">اليوم</th>
                                            <th className="py-2 text-center">إجازة</th>
                                            <th className="py-2 text-center">من</th>
                                            <th className="py-2 text-center">إلى</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        {WEEK_ORDER.map(d => {
                                            const s = scheduleDraft[d];
                                            if (!s) return null;
                                            return (
                                                <tr key={d} className={`border-b ${s.off ? 'bg-red-50' : ''}`}>
                                                    <td className="py-2 font-bold text-slate-700">{DAY_NAMES[d]}</td>
                                                    <td className="py-2 text-center">
                                                        <input type="checkbox" className="w-5 h-5 accent-red-500" checked={s.off} onChange={e=>setDay(d, { off: e.target.checked })} />
                                                    </td>
                                                    <td className="py-2 px-1">
                                                        <input type="time" disabled={s.off} value={s.from} onChange={e=>setDay(d, { from: e.target.value })} className="border rounded p-1 text-xs w-full disabled:opacity-30 disabled:bg-slate-100" />
                                                    </td>
                                                    <td className="py-2 px-1">
                                                        <input type="time" disabled={s.off} value={s.to} onChange={e=>setDay(d, { to: e.target.value })} className="border rounded p-1 text-xs w-full disabled:opacity-30 disabled:bg-slate-100" />
                                                    </td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                                <button onClick={copyFirstToAll} className="w-full mt-3 text-xs bg-teal-50 text-teal-700 py-2 rounded font-bold border border-teal-200">نسخ أوقات أول يوم عمل لباقي أيام العمل</button>
                                <p className="text-[10px] text-slate-400 mt-2 text-center">التأخير بيتحسب على مواعيد اليوم (سماح 5 دقايق)، ولو اليوم إجازة مفيش تأخير.</p>
                                <div className="flex gap-2 mt-3">
                                    <button onClick={()=>setScheduleFor(null)} className="flex-1 bg-slate-100 py-2 rounded font-bold">إلغاء</button>
                                    <button onClick={saveSchedule} className="flex-1 bg-teal-600 text-white py-2 rounded font-bold">حفظ الجدول</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {absForId && (() => {
                        const absEmp = users.find(u => u.id === absForId);
                        if (!absEmp) return null;
                        const list = calcAbsences(absEmp);
                        return (
                            <div className="fixed inset-0 modal-overlay flex items-center justify-center p-4 z-50">
                                <div className="bg-white w-full max-w-sm rounded-xl shadow-2xl p-4 max-h-[80vh] overflow-y-auto animate-fade-in">
                                    <div className="flex justify-between items-center mb-3">
                                        <h3 className="font-bold text-lg text-red-700">🚫 غياب: {absEmp.name}</h3>
                                        <button onClick={()=>setAbsForId(null)} className="text-slate-500 text-2xl leading-none">×</button>
                                    </div>
                                    <p className="text-sm font-bold mb-3">إجمالي الغياب: <span className="text-red-600">{list.length} يوم</span></p>
                                    {list.length === 0 ? (
                                        <p className="text-sm text-slate-400 text-center py-6">لا توجد أيام غياب</p>
                                    ) : (
                                        <div className="space-y-2">
                                            {list.slice().reverse().map(dt => (
                                                <div key={dt} className="flex items-center justify-between gap-2 text-xs p-2 border rounded bg-red-50">
                                                    <span className="font-bold text-slate-800">{dateLabel(dt)}</span>
                                                    <button onClick={()=>excuseAbsence(absEmp, dt)} className="bg-white text-slate-600 border px-2 py-1 rounded text-[10px] font-bold">إلغاء الغياب</button>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                    <p className="text-[10px] text-slate-400 mt-3 text-center">الغياب = يوم شغل في الجدول من غير أي تسجيل حضور أو بديل. مفيش رصيد بيتضاف عن اليوم ده.</p>
                                </div>
                            </div>
                        );
                    })()}

                    {editingUser && (
                        <div className="fixed inset-0 modal-overlay flex items-center justify-center p-4">
                            <form onSubmit={saveEdit} className="bg-white w-full max-w-sm rounded-xl p-6 shadow-2xl">
                                <h3 className="font-bold mb-4">تعديل: {editingUser.name}</h3>
                                <div className="flex items-center gap-2 border p-2 rounded justify-between bg-slate-50 cursor-pointer relative mb-2">
                                    <span className="text-sm text-slate-500">تغيير الصورة</span>
                                    <Icons.Camera />
                                    <input type="file" accept="image/*" className="absolute inset-0 opacity-0 cursor-pointer" onChange={(e) => handleImageChange(e, setEditingUser, editingUser)} />
                                </div>
                                <input placeholder="رقم الواتساب" className="w-full border p-2 mb-2 rounded" value={editingUser.whatsapp||''} onChange={e=>setEditingUser({...editingUser, whatsapp:e.target.value})} />
                                <input placeholder="الراتب" type="number" className="w-full border p-2 mb-2 rounded" value={editingUser.salary} onChange={e=>setEditingUser({...editingUser, salary:e.target.value})} />
                                <input placeholder="الساعات" type="number" className="w-full border p-2 mb-2 rounded" value={editingUser.targetHours} onChange={e=>setEditingUser({...editingUser, targetHours:e.target.value})} />
